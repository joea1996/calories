<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<title>Daily Tracker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
  #app{width:100%;max-width:430px;min-height:100vh;background:#f4f5f7;position:relative;overflow-x:hidden}

  .screen{display:none;flex-direction:column;min-height:100vh}
  .screen.active{display:flex}

  /* Topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:56px 18px 10px;background:#f4f5f7}
  .topbar-title{font-size:16px;font-weight:600;color:#1e2d4a}
  .icon-btn{background:#e8eef5;border:0.5px solid #c8d5e3;cursor:pointer;padding:0;color:#3a5580;display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;-webkit-appearance:none;appearance:none}
  .icon-btn:active{background:#d6dde8}

  /* Remaining card */
  .remaining-card{background:#fff;border-radius:18px;margin:6px 16px 12px;padding:22px 20px 20px;border:0.5px solid #d6dde8;text-align:center}
  .rem-label{font-size:11px;color:#7a94b0;letter-spacing:0.07em;text-transform:uppercase;margin-bottom:10px}
  .rem-cals{font-size:40px;font-weight:500;color:#1e2d4a;line-height:1.1}
  .rem-cals span{font-size:15px;font-weight:400;color:#4a6580;margin-left:3px}
  .rem-prot{font-size:26px;font-weight:400;color:#3a5580;margin-top:5px}
  .rem-prot span{font-size:13px;color:#7a94b0;margin-left:2px}
  .rem-bars{margin-top:14px;display:flex;flex-direction:column;gap:7px}
  .bar-row{display:flex;align-items:center;gap:8px}
  .bar-track-label{font-size:10px;color:#b0bfcc;width:28px;text-align:right}
  .bar-track{flex:1;height:5px;background:#e8ecf2;border-radius:3px;overflow:hidden}
  .bar-fill{height:100%;border-radius:3px;transition:width 0.4s}
  .bar-cal-fill{background:#3a6fa8}
  .bar-prot-fill{background:#5a8db5}

  /* Form card */
  .form-card{background:#fff;border-radius:18px;margin:0 16px 12px;padding:16px;border:0.5px solid #d6dde8}
  .form-card h3{font-size:11px;font-weight:600;color:#7a94b0;margin-bottom:12px;letter-spacing:0.06em;text-transform:uppercase}
  .field{display:flex;flex-direction:column;gap:4px;flex:1}
  .field label{font-size:11px;color:#7a94b0;font-weight:500}
  .field input{background:#f4f5f7;border:0.5px solid #d6dde8;border-radius:9px;padding:10px 11px;font-size:15px;color:#1e2d4a;outline:none;width:100%;-webkit-appearance:none;appearance:none}
  .field input:focus{border-color:#5a8db5;background:#fff}
  .desc-field{margin-bottom:8px}
  .field-row{display:flex;gap:8px;margin-bottom:8px}

  /* Buttons - always visible */
  .submit-btn{width:100%;background:#3a5f8a;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:6px;-webkit-appearance:none;appearance:none;display:block}
  .submit-btn:active{background:#2d4e75;transform:scale(0.98)}

  .bottom-btn-row{display:flex;gap:10px;margin:0 16px 24px}
  .bottom-btn{flex:1;background:#e8eef5;border:0.5px solid #c8d5e3;border-radius:12px;padding:12px;font-size:14px;font-weight:500;color:#2a4a6e;cursor:pointer;-webkit-appearance:none;appearance:none;display:block;text-align:center}
  .bottom-btn:active{background:#d6dde8}

  /* Calc toggle */
  .calc-toggle{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;padding:4px 0 6px;color:#3a5580;font-size:13px;font-weight:500;-webkit-appearance:none}
  .calc-toggle svg{transition:transform 0.2s}
  .calc-toggle.open svg{transform:rotate(180deg)}
  .calc-section{display:none;border-top:0.5px solid #e8ecf2;padding-top:12px;margin-top:2px}
  .calc-section.open{display:block}
  .ingr-list{margin-bottom:8px}
  .ingr-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;background:#f4f5f7;border-radius:9px;padding:8px 10px}
  .ingr-row span{font-size:12px;color:#3a5580;flex:1}
  .del-btn{background:#e0e7ef;border:none;cursor:pointer;color:#6a7f99;font-size:16px;line-height:1;padding:2px 7px;border-radius:6px;-webkit-appearance:none}
  .del-btn:active{background:#c8d5e3}
  .add-ingr-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .add-ingr-row .field{flex:1;min-width:60px}
  .add-ingr-row .field.wide{flex:2.2;min-width:100px}
  .add-ingr-btn{width:100%;background:#dde7f2;border:0.5px solid #c0d0e2;border-radius:9px;color:#2a4a6e;font-size:13px;font-weight:500;padding:9px 10px;cursor:pointer;margin-bottom:8px;-webkit-appearance:none;display:block;text-align:center}
  .add-ingr-btn:active{background:#c8d8ea}
  .calc-totals{background:#edf2f7;border-radius:9px;padding:9px 12px;display:flex;gap:16px;margin-bottom:10px;font-size:13px;color:#3a5580}
  .calc-totals strong{color:#1e2d4a;font-weight:600}
  .use-calc-btn{width:100%;background:#5a8db5;color:#fff;border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:500;cursor:pointer;-webkit-appearance:none;display:block;text-align:center}
  .use-calc-btn:active{background:#4a7da5;transform:scale(0.98)}

  /* History */
  .hist-day{background:#fff;border-radius:14px;margin:0 16px 10px;border:0.5px solid #d6dde8;overflow:hidden}
  .hist-day-header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#edf2f7;border-bottom:0.5px solid #d6dde8}
  .hist-day-header .date{font-size:13px;font-weight:600;color:#1e2d4a}
  .hist-day-header .day-totals{font-size:11px;color:#7a94b0}
  .hist-entry{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:9px 14px;border-bottom:0.5px solid #f0f2f5}
  .hist-entry:last-child{border-bottom:none}
  .hist-entry .desc{font-size:13px;color:#1e2d4a;grid-column:1}
  .hist-entry .macros{font-size:11px;color:#5a7a9a;grid-column:1}
  .hist-entry .remaining{font-size:11px;color:#7a94b0;text-align:right;grid-column:2;grid-row:1/3;display:flex;align-items:center}

  /* Settings */
  .settings-section{background:#fff;border-radius:14px;margin:0 16px 12px;border:0.5px solid #d6dde8;overflow:hidden}
  .settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:0.5px solid #f0f2f5}
  .settings-row:last-child{border-bottom:none}
  .settings-row label{font-size:14px;color:#1e2d4a;font-weight:500}
  .settings-row input{background:#f4f5f7;border:0.5px solid #d6dde8;border-radius:9px;padding:8px 11px;font-size:14px;color:#1e2d4a;width:120px;text-align:right;outline:none;-webkit-appearance:none}
  .settings-row input:focus{border-color:#5a8db5}
  .save-settings-btn{width:calc(100% - 32px);margin:0 16px 24px;background:#3a5f8a;color:#fff;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;-webkit-appearance:none;display:block;text-align:center}
  .save-settings-btn:active{background:#2d4e75}

  .scroll-area{flex:1;overflow-y:auto;padding-top:4px;-webkit-overflow-scrolling:touch}
  .empty-hist{text-align:center;color:#a0b0c4;font-size:14px;padding:48px 20px}
  .section-label{font-size:11px;font-weight:600;color:#7a94b0;letter-spacing:0.06em;text-transform:uppercase;padding:12px 18px 4px}

  /* Toast */
  .toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1e2d4a;color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap;z-index:999}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="toast" class="toast"></div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="screen active">
    <div class="topbar">
      <span class="topbar-title">Daily Tracker</span>
      <button class="icon-btn" onclick="showScreen('settings-screen')" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="9" cy="9" r="2.5"/>
          <path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4"/>
        </svg>
      </button>
    </div>

    <div class="remaining-card">
      <div class="rem-label">Remaining today</div>
      <div class="rem-cals" id="rem-cals-display">0<span>kcal</span></div>
      <div class="rem-prot" id="rem-prot-display">0<span>g protein</span></div>
      <div class="rem-bars">
        <div class="bar-row">
          <span class="bar-track-label">cal</span>
          <div class="bar-track"><div class="bar-fill bar-cal-fill" id="cal-bar" style="width:100%"></div></div>
        </div>
        <div class="bar-row">
          <span class="bar-track-label">pro</span>
          <div class="bar-track"><div class="bar-fill bar-prot-fill" id="prot-bar" style="width:100%"></div></div>
        </div>
      </div>
    </div>

    <div class="form-card">
      <h3>Log food</h3>
      <div class="desc-field field">
        <label>Description</label>
        <input type="text" id="food-desc" placeholder="e.g. Chicken &amp; rice bowl" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Calories</label>
          <input type="number" id="food-cals" placeholder="0" min="0" inputmode="decimal">
        </div>
        <div class="field">
          <label>Protein (g)</label>
          <input type="number" id="food-prot" placeholder="0" min="0" inputmode="decimal">
        </div>
      </div>

      <button class="calc-toggle" id="calc-toggle-btn" onclick="toggleCalc()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5l4 4 4-4"/>
        </svg>
        Calculate from ingredients
      </button>

      <div class="calc-section" id="calc-section">
        <div class="ingr-list" id="ingr-list"></div>
        <div class="add-ingr-row">
          <div class="field wide">
            <label>Ingredient</label>
            <input type="text" id="ingr-name" placeholder="e.g. Flour" autocomplete="off">
          </div>
          <div class="field">
            <label>Used (g)</label>
            <input type="number" id="ingr-used" placeholder="17" inputmode="decimal">
          </div>
          <div class="field">
            <label>Cal/100g</label>
            <input type="number" id="ingr-cal100" placeholder="364" inputmode="decimal">
          </div>
          <div class="field">
            <label>Pro/100g</label>
            <input type="number" id="ingr-pro100" placeholder="10" inputmode="decimal">
          </div>
        </div>
        <button class="add-ingr-btn" onclick="addIngredient()">+ Add ingredient</button>
        <div class="calc-totals" id="calc-totals" style="display:none">
          <span>Total: <strong id="calc-total-cals">0</strong> kcal</span>
          <span><strong id="calc-total-prot">0</strong>g protein</span>
        </div>
        <button class="use-calc-btn" onclick="useCalcTotals()">Use these totals ↑</button>
      </div>

      <button class="submit-btn" onclick="submitFood()">Submit</button>
    </div>

    <div class="bottom-btn-row">
      <button class="bottom-btn" onclick="showScreen('history-screen')">History</button>
    </div>
  </div>

  <!-- HISTORY SCREEN -->
  <div id="history-screen" class="screen">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('main-screen')" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 14l-5-5 5-5"/>
        </svg>
      </button>
      <span class="topbar-title">History</span>
      <span style="width:36px"></span>
    </div>
    <div class="scroll-area" id="history-list"></div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div id="settings-screen" class="screen">
    <div class="topbar">
      <button class="icon-btn" onclick="showScreen('main-screen')" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 14l-5-5 5-5"/>
        </svg>
      </button>
      <span class="topbar-title">Settings</span>
      <span style="width:36px"></span>
    </div>
    <div class="section-label">Daily targets</div>
    <div class="settings-section">
      <div class="settings-row">
        <label>Calorie goal</label>
        <input type="number" id="goal-cals" placeholder="2000" inputmode="decimal">
      </div>
      <div class="settings-row">
        <label>Protein goal (g)</label>
        <input type="number" id="goal-prot" placeholder="150" inputmode="decimal">
      </div>
    </div>
    <button class="save-settings-btn" onclick="saveSettings()">Save targets</button>
  </div>
</div>

<script>
const KEY_STATE = 'ct_state_v2';
const KEY_HIST  = 'ct_hist_v2';

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function fmtDate(s) {
  const [y, m, d] = s.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return months[parseInt(m) - 1] + ' ' + parseInt(d) + ', ' + y;
}

let state   = { goalCals: 2000, goalProt: 150, todayDate: '', consumedCals: 0, consumedProt: 0 };
let history = [];
let ingredients = [];

function loadData() {
  try { const s = localStorage.getItem(KEY_STATE); if (s) state = { ...state, ...JSON.parse(s) }; } catch(e) {}
  try { const h = localStorage.getItem(KEY_HIST);  if (h) history = JSON.parse(h); } catch(e) {}
  checkDayReset();
  renderMain();
  document.getElementById('goal-cals').value = state.goalCals;
  document.getElementById('goal-prot').value = state.goalProt;
}

function checkDayReset() {
  const today = todayStr();
  if (state.todayDate !== today) {
    state.todayDate    = today;
    state.consumedCals = 0;
    state.consumedProt = 0;
    saveState();
  }
}

function saveState()   { try { localStorage.setItem(KEY_STATE, JSON.stringify(state)); }   catch(e) {} }
function saveHistory() { try { localStorage.setItem(KEY_HIST,  JSON.stringify(history)); } catch(e) {} }

function renderMain() {
  const remCals = Math.max(0, state.goalCals - state.consumedCals);
  const remProt = Math.max(0, state.goalProt - state.consumedProt);
  document.getElementById('rem-cals-display').innerHTML = Math.round(remCals) + '<span>kcal</span>';
  document.getElementById('rem-prot-display').innerHTML = Math.round(remProt * 10) / 10 + '<span>g protein</span>';
  const calPct  = state.goalCals > 0 ? Math.max(0, Math.min(100, (remCals / state.goalCals) * 100)) : 0;
  const protPct = state.goalProt > 0 ? Math.max(0, Math.min(100, (remProt / state.goalProt) * 100)) : 0;
  document.getElementById('cal-bar').style.width  = calPct  + '%';
  document.getElementById('prot-bar').style.width = protPct + '%';
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
  if (id === 'history-screen') renderHistory();
}

function toggleCalc() {
  document.getElementById('calc-toggle-btn').classList.toggle('open');
  document.getElementById('calc-section').classList.toggle('open');
}

function addIngredient() {
  const name    = document.getElementById('ingr-name').value.trim();
  const used    = parseFloat(document.getElementById('ingr-used').value)    || 0;
  const cal100  = parseFloat(document.getElementById('ingr-cal100').value)  || 0;
  const pro100  = parseFloat(document.getElementById('ingr-pro100').value)  || 0;
  if (!name || used <= 0) { showToast('Enter ingredient name and amount'); return; }
  const cals = Math.round((cal100 * used) / 100);
  const prot = Math.round((pro100 * used) / 100 * 10) / 10;
  ingredients.push({ name, used, cals, prot });
  document.getElementById('ingr-name').value   = '';
  document.getElementById('ingr-used').value   = '';
  document.getElementById('ingr-cal100').value = '';
  document.getElementById('ingr-pro100').value = '';
  renderIngredients();
}

function removeIngredient(i) {
  ingredients.splice(i, 1);
  renderIngredients();
}

function renderIngredients() {
  const list   = document.getElementById('ingr-list');
  const totals = document.getElementById('calc-totals');
  list.innerHTML = '';
  let tc = 0, tp = 0;
  ingredients.forEach((ing, i) => {
    tc += ing.cals; tp += ing.prot;
    const row = document.createElement('div');
    row.className = 'ingr-row';
    row.innerHTML = '<span>' + ing.name + ' (' + ing.used + 'g) — ' + ing.cals + ' kcal, ' + ing.prot + 'g</span>'
      + '<button class="del-btn" onclick="removeIngredient(' + i + ')">×</button>';
    list.appendChild(row);
  });
  totals.style.display = ingredients.length > 0 ? 'flex' : 'none';
  document.getElementById('calc-total-cals').textContent = Math.round(tc);
  document.getElementById('calc-total-prot').textContent = Math.round(tp * 10) / 10;
}

function useCalcTotals() {
  let tc = 0, tp = 0;
  ingredients.forEach(i => { tc += i.cals; tp += i.prot; });
  if (ingredients.length === 0) { showToast('Add at least one ingredient'); return; }
  document.getElementById('food-cals').value = Math.round(tc);
  document.getElementById('food-prot').value = Math.round(tp * 10) / 10;
  document.getElementById('calc-toggle-btn').classList.remove('open');
  document.getElementById('calc-section').classList.remove('open');
  ingredients = [];
  renderIngredients();
  showToast('Totals filled in');
}

function submitFood() {
  const desc = document.getElementById('food-desc').value.trim();
  const cals = parseFloat(document.getElementById('food-cals').value) || 0;
  const prot = parseFloat(document.getElementById('food-prot').value) || 0;
  if (!desc)              { showToast('Please add a description'); return; }
  if (cals === 0 && prot === 0) { showToast('Add calories or protein'); return; }
  state.consumedCals += cals;
  state.consumedProt += prot;
  const remCals = Math.max(0, state.goalCals - state.consumedCals);
  const remProt = Math.max(0, state.goalProt - state.consumedProt);
  history.unshift({
    date: todayStr(), desc, cals, prot,
    remCals: Math.round(remCals),
    remProt: Math.round(remProt * 10) / 10
  });
  saveState();
  saveHistory();
  renderMain();
  document.getElementById('food-desc').value = '';
  document.getElementById('food-cals').value = '';
  document.getElementById('food-prot').value = '';
  showToast('Logged!');
}

function renderHistory() {
  const list = document.getElementById('history-list');
  if (history.length === 0) { list.innerHTML = '<div class="empty-hist">No entries yet</div>'; return; }
  const byDay = {};
  history.forEach(e => { if (!byDay[e.date]) byDay[e.date] = []; byDay[e.date].push(e); });
  const days = Object.keys(byDay).sort().reverse();
  list.innerHTML = '';
  days.forEach(day => {
    const entries   = byDay[day];
    const totalCals = entries.reduce((s, e) => s + e.cals, 0);
    const totalProt = entries.reduce((s, e) => s + e.prot, 0);
    const block = document.createElement('div');
    block.className = 'hist-day';
    const header = document.createElement('div');
    header.className = 'hist-day-header';
    header.innerHTML = '<span class="date">' + fmtDate(day) + '</span>'
      + '<span class="day-totals">' + Math.round(totalCals) + ' kcal · ' + Math.round(totalProt * 10) / 10 + 'g protein</span>';
    block.appendChild(header);
    entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'hist-entry';
      row.innerHTML = '<span class="desc">' + e.desc + '</span>'
        + '<span class="macros">' + e.cals + ' kcal · ' + e.prot + 'g protein</span>'
        + '<span class="remaining">' + e.remCals + ' kcal left<br><span style="color:#a0b8cc">' + e.remProt + 'g left</span></span>';
      block.appendChild(row);
    });
    list.appendChild(block);
  });
}

function saveSettings() {
  const c = parseInt(document.getElementById('goal-cals').value) || 2000;
  const p = parseInt(document.getElementById('goal-prot').value) || 150;
  state.goalCals = c;
  state.goalProt = p;
  saveState();
  renderMain();
  showToast('Targets saved');
  showScreen('main-screen');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

loadData();
setInterval(checkDayReset, 60000);
</script>
</body>
</html>
